<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit popup</title>
    <link rel="stylesheet" href="../homepage/styles/global.css" />
    <script type="module" src="./popup.js" defer></script>
  </head>
  <style>
    body {
      background: black;
      width: 250px;
      height: 50px;
      padding: 10px;
    }

    .header {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .header h3 {
      font-size: 1rem;
    }

    .header img {
      object-fit: cover;
      width: 2rem;
      height: 2rem;
      border-radius: 5px;
    }

    .addWebsite div {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-block: 1rem;
    }

    .addWebsite label {
      font-size: 0.8rem;
    }
  </style>
  <body>
    <div class="container">
      <div class="header">
        <img src="../public/logo/icon-128.png" alt="" srcset="" />
        <h3>Orbit</h3>
      </div>

      <div class="main">
        <div class="addWebsite">
          <div>
            <input type="checkbox" id="addCheckbox" />
            <label for="addCheckbox">Add Website To Quick Access</label>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
